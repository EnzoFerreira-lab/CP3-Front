<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Contato - Tech Magic</title>
    <link rel="stylesheet" href="../src/css/estilo.css">
</head>
<body class="layout">
    <div id="container">
        <header>
            <img src="../src/assets/logo.jpg" alt="Logo TechZone" class="logo">
            <h1>Tech Magic</h1>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="contato-form">
                <h2>Fale com a gente</h2>
                <form>
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" name="nome" required><br>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required><br>

                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea><br>

                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Telefone: (11) 90000-0000 | Email: contato@techmagic.com.br</p>
            <p>&copy;2025Techmagic</p>
        </footer>
    </div>
</body>
</html>
